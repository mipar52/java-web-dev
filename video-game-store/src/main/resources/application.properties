spring.application.name=video-game-store
server.port = 8081

#####################
#       DB          #
#####################
spring.datasource.url=jdbc:h2:file:./data/vgstore;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.jdbc.core=DEBUG

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#####################
#       PayPal       #
#####################

spring.config.import=optional:file:../secrets/secrets.properties

paypal.base-url=https://api-m.sandbox.paypal.com
paypal.return-url=http://localhost:8081/checkout/paypal/success
paypal.cancel-url=http://localhost:8081/checkout/paypal/cancel
paypal.brand-name=Video Game Store
paypal.currency=EUR