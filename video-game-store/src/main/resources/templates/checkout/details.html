<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order #' + ${order.id})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4" style="max-width: 980px;">
  <div class="ds-card p-3 p-lg-4">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h1 class="ds-title mb-1">Order #<span th:text="${order.id}">1</span></h1>
        <div class="ds-muted">
          Status: <span th:text="${order.status}">CREATED</span> • Payment: <span th:text="${order.paymentMethod}">COD</span>
        </div>
      </div>
      <a class="btn ds-btn" th:href="@{/games}">Back to games</a>
    </div>

    <div class="ds-divider"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="ds-muted small mb-1">Shipping</div>
        <div th:text="${order.shippingAddress}">Address</div>
        <div><span th:text="${order.zip}">ZIP</span> <span th:text="${order.city}">City</span></div>
        <div class="ds-muted small mt-2">Phone: <span th:text="${order.phone}">+123</span></div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="ds-muted small mb-1">Items</div>
        <div class="ds-card p-3 mb-2" style="background: rgba(255,255,255,.02);" th:each="it : ${order.items}">
          <div class="d-flex justify-content-between">
            <div>
              <div th:text="${it.game.name}">Game</div>
              <div class="ds-muted small">x<span th:text="${it.quantity}">1</span> @ <span th:text="${it.unitPrice} + ' €'">0</span></div>
            </div>
            <div class="ds-price" th:text="${it.lineTotal} + ' €'">0</div>
          </div>
        </div>

        <div class="ds-divider"></div>
        <div class="d-flex justify-content-between align-items-center">
          <div class="ds-muted">Total</div>
          <div class="fs-4 ds-price" th:text="${total} + ' €'">0</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
