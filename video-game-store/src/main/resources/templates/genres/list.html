<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-end mb-3">
    <div>
      <h1 class="ds-title mb-1">Categories</h1>
      <div class="ds-muted">Choose a path. The catalogue will narrow accordingly.</div>
    </div>
    <a class="btn ds-btn" th:href="@{/games}">All games</a>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" th:each="gen : ${genres}">
      <div class="ds-card p-3 h-100 d-flex flex-column">

        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="ds-title" style="font-size:1.05rem;" th:text="${gen.name}">action</div>
            <div class="ds-muted small">Category</div>
          </div>
          <span class="ds-badge">Ember</span>
        </div>

        <div class="ds-divider"></div>

        <p class="ds-muted small flex-grow-1 mb-3">
          Browse games marked by this sigil.
        </p>

        <!-- Entry point: single genre -->
        <a class="btn ds-btn"
           th:href="@{/games(genreId=${gen.id})}">
          View games
        </a>

      </div>
    </div>
  </div>
</div>

</body>
</html>
