<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
    <h1 class="ds-title mb-3">Cart</h1>

    <div class="ds-card p-3 p-lg-4" th:if="${items != null && !items.isEmpty()}">
        <div class="ds-divider"></div>

        <div class="row g-2 align-items-center mb-2" th:each="it : ${items}">
            <div class="col-12 col-lg-5">
                <div class="ds-title" style="font-size:1rem;" th:text="${it.name}">Game</div>
                <div class="ds-muted small">Unit price: <span th:text="${it.price} + ' €'">0</span></div>
            </div>

            <div class="col-6 col-lg-3">
                <form th:action="@{/cart/items/{id}(id=${it.gameId})}" method="post" class="d-flex gap-2">
                    <input class="form-control form-control-sm" type="number" name="quantity" min="0"
                           th:value="${it.quantity}"/>
                    <button class="btn btn-sm ds-btn" type="submit">Update</button>
                </form>
            </div>

            <div class="col-3 col-lg-2 text-end">
                <div class="ds-price" th:text="${it.lineTotal} + ' €'">0</div>
            </div>

            <div class="col-3 col-lg-2 text-end">
                <form th:action="@{/cart/items/{id}/remove(id=${it.gameId})}" method="post">
                    <button class="btn btn-sm ds-btn" type="submit">Remove</button>
                </form>
            </div>

            <div class="ds-divider"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <form th:action="@{/cart/clear}" method="post">
                <button class="btn ds-btn" type="submit">Clear cart</button>
            </form>

            <div class="text-end">
                <div class="ds-muted small">Total</div>
                <div class="fs-4 ds-price" th:text="${total} + ' €'">0</div>
            </div>
        </div>
    </div>

    <div class="ds-card p-3 p-lg-4" th:if="${items == null || items.isEmpty()}">
        <div class="ds-muted">Your cart is empty.</div>
        <div class="mt-3">
            <a class="btn ds-btn" th:href="@{/games}">Back to games</a>
        </div>
    </div>

    <a class="btn ds-btn" th:href="@{/checkout}" style="margin-top:16px">Proceed to checkout</a>

</div>

</body>
</html>
