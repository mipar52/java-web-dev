<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-5" style="max-width: 720px;">
  <div class="ds-card p-4 p-lg-5">
    <h1 class="ds-title mb-2">Login</h1>
    <div class="ds-muted mb-3">Return to the bonfire.</div>

    <div class="alert"
         style="background: rgba(214,162,77,.08); border: 1px solid rgba(214,162,77,.18); color: var(--text);"
         th:if="${param.registered != null}">
      Account created. You may sign in now.
    </div>

    <div class="alert"
         style="background: rgba(180,60,60,.12); border: 1px solid rgba(180,60,60,.25); color: var(--text);"
         th:if="${param.error != null}">
      Invalid username or password.
    </div>

    <div class="alert"
         style="background: rgba(120,120,120,.12); border: 1px solid rgba(120,120,120,.22); color: var(--text);"
         th:if="${param.logout != null}">
      You have been logged out.
    </div>

    <form th:action="@{/login}" method="post" class="mt-3">
      <!-- CSRF -->
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label ds-muted" for="username">Username</label>
        <input class="form-control" id="username" name="username" type="text" autocomplete="username" required/>
      </div>

      <div class="mb-3">
        <label class="form-label ds-muted" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required/>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a class="ds-muted" th:href="@{/register}">Create account</a>
        <button class="btn ds-btn" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
