<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-5" style="max-width: 820px;">
  <div class="ds-card p-4 p-lg-5">
    <h1 class="ds-title mb-2">Register</h1>
    <div class="ds-muted mb-3">Kindle a new identity.</div>

    <div class="alert"
         style="background: rgba(180,60,60,.12); border: 1px solid rgba(180,60,60,.25); color: var(--text);"
         th:if="${error != null}"
         th:text="${error}">
      Error
    </div>

    <form th:action="@{/register}" method="post" th:object="${form}" class="mt-3">
      <!-- CSRF -->
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="username">Username</label>
          <input class="form-control" id="username" th:field="*{username}" type="text" autocomplete="username" required/>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="email">Email</label>
          <input class="form-control" id="email" th:field="*{email}" type="email" autocomplete="email" required/>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="firstName">First name</label>
          <input class="form-control" id="firstName" th:field="*{firstName}" type="text" autocomplete="given-name"/>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="lastName">Last name</label>
          <input class="form-control" id="lastName" th:field="*{lastName}" type="text" autocomplete="family-name"/>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="mobilePhone">Mobile phone</label>
          <input class="form-control" id="mobilePhone" th:field="*{mobilePhone}" type="tel" autocomplete="tel"/>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label ds-muted" for="password">Password</label>
          <input class="form-control" id="password" th:field="*{password}" type="password"
                 autocomplete="new-password" minlength="6" required/>
          <div class="ds-muted small mt-1">Minimum 6 characters.</div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a class="ds-muted" th:href="@{/login}">Back to login</a>
        <button class="btn ds-btn" type="submit">Create account</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
