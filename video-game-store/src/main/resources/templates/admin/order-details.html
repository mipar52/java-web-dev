<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Order ' + ${order.id})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
    <a th:href="@{/admin/orders}" class="btn btn-sm ds-btn mb-3">&larr; Back to orders</a>

    <div class="ds-card p-3 p-lg-4 mb-3">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h1 class="ds-title mb-1">Order #<span th:text="${order.id}">1</span></h1>
                <div class="ds-muted small">
                    Customer: <strong th:text="${order.user.username}">user</strong><br/>
                    Created: <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">-</span><br/>
                    Paid: <span th:text="${order.paidAt != null ? #temporals.format(order.paidAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
                </div>
            </div>

            <div class="text-end">
                <div class="ds-badge" th:text="${order.status}">STATUS</div>
                <div class="ds-muted small mt-2">
                    Payment: <span th:text="${order.paymentMethod}">-</span><br/>
                    External: <span th:text="${order.externalPaymentId != null ? order.externalPaymentId : '-'}">-</span>
                </div>
            </div>
        </div>

        <div class="ds-divider"></div>

        <div class="row g-2">
            <div class="col-12 col-lg-6">
                <div class="ds-muted small mb-1">Shipping</div>

                <form th:action="@{'/admin/orders/' + ${order.id} + '/shipping'}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-2">
                        <label class="form-label ds-muted">Address</label>
                        <input class="form-control" name="shippingAddress" th:value="${order.shippingAddress}" required/>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label ds-muted">City</label>
                            <input class="form-control" name="city" th:value="${order.city}" required/>
                        </div>
                        <div class="col-6">
                            <label class="form-label ds-muted">ZIP</label>
                            <input class="form-control" name="zip" th:value="${order.zip}" required/>
                        </div>
                    </div>

                    <div class="mt-2">
                        <label class="form-label ds-muted">Phone</label>
                        <input class="form-control" name="phone" th:value="${order.phone}" required/>
                    </div>

                    <div class="mt-3 d-flex justify-content-end">
                        <button class="btn ds-btn" type="submit">Save shipping</button>
                    </div>
                </form>
            </div>

            <div class="col-12 col-lg-6">
                <div class="ds-muted small">Change status</div>
                <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post" class="d-flex gap-2">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <select class="form-select" name="status">
                        <option th:each="st : ${T(com.milan.videogamestore.model.orders.OrderStatus).values()}"
                                th:value="${st}"
                                th:selected="${st == order.status}"
                                th:text="${st}">
                        </option>
                    </select>

                    <button class="btn ds-btn" type="submit">Save</button>
                </form>
            </div>
        </div>
    </div>

    <div class="ds-card p-3 p-lg-4">
        <h2 class="ds-title mb-3" style="font-size: 1.1rem;">Items</h2>

        <div class="table-responsive">
            <table class="table table-dark table-striped align-middle mb-0">
                <thead>
                <tr>
                    <th>Game</th>
                    <th class="text-end">Unit</th>
                    <th class="text-end">Qty</th>
                    <th class="text-end">Line total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="it : ${order.items}">
                    <td th:text="${it.game.name}">Game</td>
                    <td class="text-end" th:text="${it.unitPrice}">0.00</td>
                    <td class="text-end" th:text="${it.quantity}">1</td>
                    <td class="text-end" th:text="${it.lineTotal}">0.00</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Total</th>
                    <th class="text-end"
                        th:text="${#aggregates.sum(order.items.![lineTotal])}">0.00</th>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

</body>
</html>
