<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Games')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="ds-title mb-0">Admin: Games</h1>
    <a class="btn ds-btn" th:href="@{/admin/games/new}">+ New game</a>
  </div>

  <form class="ds-card p-3 mb-3" method="get" th:action="@{/admin/games}">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-10">
        <label class="form-label ds-muted">Search</label>
        <input class="form-control" name="q" th:value="${q}" placeholder="Game name..."/>
      </div>
      <div class="col-12 col-md-2 d-flex gap-2">
        <button class="btn ds-btn w-100" type="submit">Filter</button>
        <a class="btn ds-btn w-100" th:href="@{/admin/games}">Reset</a>
      </div>
    </div>
  </form>

  <div class="ds-card p-3">
    <div class="ds-muted small mb-2">
      Total results: <span th:text="${games.size()}">0</span>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Type</th>
          <th>Released</th>
          <th>GOTY</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="g : ${games}">
          <td><a th:href="@{/admin/games/{id}(id=${g.id})}" th:text="${g.id}">1</a></td>
          <td><a th:href="@{/admin/games/{id}(id=${g.id})}" th:text="${g.name}">Name</a></td>
          <td th:text="${g.price}">0.00</td>
          <td th:text="${g.gameType != null ? g.gameType.name : '-'}">-</td>
          <td th:text="${g.releaseDate != null ? #temporals.format(g.releaseDate, 'yyyy-MM-dd') : '-'}">-</td>
          <td th:text="${g.wonGameOfTheYearAward ? 'YES' : 'NO'}">NO</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
