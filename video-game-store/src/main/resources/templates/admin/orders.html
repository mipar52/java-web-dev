<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
  <h1 class="ds-title mb-3">Admin: Orders</h1>

  <form class="ds-card p-3 mb-3" method="get" th:action="@{/admin/orders}">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-4">
        <label class="form-label ds-muted">Customer (username contains)</label>
        <input class="form-control" name="q" th:value="${q}" placeholder="e.g. milan"/>
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label ds-muted">From</label>
        <input class="form-control" type="date" name="from" th:value="${from}"/>
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label ds-muted">To</label>
        <input class="form-control" type="date" name="to" th:value="${to}"/>
      </div>

      <div class="col-12 col-md-2 d-flex gap-2">
        <button class="btn ds-btn w-100" type="submit">Filter</button>
        <a class="btn ds-btn w-100" th:href="@{/admin/orders}">Reset</a>
      </div>
    </div>
  </form>

  <div class="ds-card p-3">
    <div class="ds-muted small mb-2">
      Total results: <span th:text="${orders.size()}">0</span>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-striped align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Customer</th>
          <th>Created</th>
          <th>Status</th>
          <th>Payment</th>
          <th>Paid at</th>
          <th>External payment</th>
          <th>Order Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="${o.id}">1</td>
          <td th:text="${o.user.username}">user</td>
          <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
          <td>
            <form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="d-flex gap-2">
              <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              <select class="form-select form-select-sm" name="status">
                <option th:each="st : ${T(com.milan.videogamestore.model.orders.OrderStatus).values()}"
                        th:value="${st}"
                        th:selected="${st == o.status}"
                        th:text="${st}">
                </option>
              </select>

              <button class="btn ds-btn btn-sm" type="submit">Save</button>
            </form>
          </td>
          <td th:text="${o.paymentMethod}">-</td>
          <td th:text="${o.paidAt != null ? #temporals.format(o.paidAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
          <td th:text="${o.externalPaymentId != null ? o.externalPaymentId : '-'}">-</td>
          <td>
            <form th:action="@{/admin/orders/{id}(id=${o.id})}" method="post">
              <button class="btn btn-sm ds-btn" type="submit">Details</button>
            </form>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
