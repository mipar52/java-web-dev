<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title}">VG Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/darksouls.css}" rel="stylesheet"/>
</head>

<body>
  <nav th:fragment="nav" class="navbar navbar-expand-lg ds-navbar">
    <div class="container py-2">
      <a class="navbar-brand ds-title ds-brand" th:href="@{/games}">Video Game Store</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dsNav"
              aria-controls="dsNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="dsNav">
        <!-- Left: main nav -->
        <div class="navbar-nav gap-2">
          <a class="btn btn-sm ds-btn" th:href="@{/games}">Games</a>
          <a class="btn btn-sm ds-btn" th:href="@{/genres}">Categories</a>
          <a class="btn btn-sm ds-btn" th:href="@{/cart}">
            Cart <span th:if="${cartItemCount > 0}" th:text="'(' + ${cartItemCount} + ')'">(0)</span>
          </a>
        </div>

        <!-- Right: user/auth -->
        <div class="ms-lg-auto mt-3 mt-lg-0 d-flex flex-wrap gap-2 align-items-center justify-content-lg-end">

          <!-- Logged in: user pill -->
          <div class="ds-userpill" sec:authorize="isAuthenticated()">
            <span class="ds-userpill-name" sec:authentication="name">user</span>
            <span class="ds-badge ms-2" sec:authorize="hasRole('ADMIN')">ADMIN</span>
          </div>

          <!-- Logged in links -->
          <a class="btn btn-sm ds-btn" sec:authorize="isAuthenticated()" th:href="@{/orders}">My orders</a>
          <a class="btn btn-sm ds-btn" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>

          <!-- Not logged in -->
          <a class="btn btn-sm ds-btn" sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
          <a class="btn btn-sm ds-btn" sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>

          <!-- Logout pushed to the far right on large screens -->
          <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0 ms-lg-2">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm ds-btn ds-btn-logout" type="submit">Logout</button>
          </form>

        </div>
      </div>
    </div>
  </nav>
<div th:fragment="container(content)">
  <div class="container py-4" th:insert="${content}"></div>
</div>
</body>
</html>
