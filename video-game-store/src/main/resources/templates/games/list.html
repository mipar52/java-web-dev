<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Games')}"><title>Games</title></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h1 class="ds-title mb-1">Games</h1>
            <div class="ds-muted">Browse the catalogue. Choose wisely.</div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="g : ${games}">
            <div class="ds-card p-3 h-100 d-flex flex-column">

                <!-- image -->
                <div class="ds-thumb mb-3">
                    <img th:if="${g.imageUrl != null && !#strings.isEmpty(g.imageUrl)}"
                         th:src="${g.imageUrl}"
                         alt="cover"/>
                    <div th:if="${g.imageUrl == null || #strings.isEmpty(g.imageUrl)}"
                         class="h-100 d-flex align-items-center justify-content-center ds-muted">
                        No cover
                    </div>
                </div>

                <!-- title + price -->
                <div class="d-flex justify-content-between align-items-start">
                    <div class="me-2">
                        <div class="ds-title" style="font-size: 1.05rem;" th:text="${g.name}">Game name</div>
                        <div class="ds-muted small" th:if="${g.gameType != null}">
                            Type: <span th:text="${g.gameType.name}">singleplayer</span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="ds-price" th:text="${g.price} + ' €'">59.99 €</div>
                        <span class="ds-badge" th:if="${g.wonGameOfTheYearAward}">GOTY</span>
                    </div>
                </div>

                <div class="ds-divider"></div>

                <!-- quick info -->
                <div class="ds-muted small mb-2">
          <span th:if="${g.releaseDate != null}">
            Released: <span th:text="${#temporals.format(g.releaseDate, 'yyyy-MM-dd')}">2026-01-01</span>
          </span>
                    <span th:if="${g.metacriticScore != null}">
            <span th:if="${g.releaseDate != null}"> • </span>
            Metacritic: <span th:text="${g.metacriticScore}">90</span>
          </span>
                    <span>
            <span th:if="${g.releaseDate != null || g.metacriticScore != null}"> • </span>
            Reviews: <span th:text="${g.reviews != null ? g.reviews.size() : 0}">0</span>
          </span>
                </div>

                <!-- categories -->
                <div class="mb-2">
                    <div class="ds-muted small mb-1">Categories</div>
                    <span class="ds-chip" th:each="cat : ${g.gameGenres}" th:text="${cat.name}">action</span>
                </div>

                <!-- consoles -->
                <div class="mb-3">
                    <div class="ds-muted small mb-1">Platforms</div>
                    <span class="ds-chip" th:each="c : ${g.consoles}" th:text="${c.name}">PC</span>
                </div>

                <!-- description -->
                <p class="ds-muted small flex-grow-1" th:if="${g.description != null}"
                   th:text="${#strings.abbreviate(g.description, 140)}">
                    Description...
                </p>

                <!-- actions -->
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-sm ds-btn" th:href="@{/games/{id}(id=${g.id})}">View details</a>
                </div>
                <form th:action="@{/cart/items}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="gameId" th:value="${g.id}"/>
                    <input type="hidden" name="returnUrl" th:value="${currentPath}"/>
                    <button class="btn btn-sm ds-btn" type="submit">Add</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
